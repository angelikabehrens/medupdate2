# VORLAGE für die geschützten Einstellungen ("Secrets") von medupdate 2.
#
# WICHTIG: Den ECHTEN Schlüssel und den echten Zugangscode NICHT in diese Datei schreiben und
# diese Datei NICHT mit echten Werten auf GitHub hochladen. Die echten Werte werden nur direkt im
# Feld "Secrets" von Streamlit Cloud eingefügt (Advanced settings beim Bereitstellen, später unter
# App-Einstellungen -> Secrets). Lokal (VS Code) gehören sie in .streamlit/secrets.toml, die per
# .gitignore vom Hochladen ausgeschlossen ist.

# Gemeinsamer KI-Zugang (am besten ein eigener Schlüssel in einem eigenen Workspace mit Ausgabenlimit).
ANTHROPIC_API_KEY = "sk-ant-..."

# Optional, aber empfohlen: Zugangscode beim ersten Öffnen.
APP_PASSWORD = "..."

# Optional: Kontakt-E-Mail für PubMed/Unpaywall als Vorbelegung.
UNPAYWALL_EMAIL = ""

# Optional: wie viele Publikationen gleichzeitig bearbeitet werden (Standard 2). Bei häufigen
# Abbrüchen wegen "Rate-Limit" auf "1" setzen.
# PARALLEL_WORKERS = "1"
